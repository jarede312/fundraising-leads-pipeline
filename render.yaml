services:
  - type: web
    name: fundraising-webapp
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PG_DSN
        fromDatabase:
          name: fundraising-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5
      - key: USER_AGENT
        value: FundraisingProspectEngine/0.1
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: fundraising-db
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all
